<main>
<section class="wrap">
<h1>Contact me</h1>
<div class="cols">
<div>
<p>Send a message and I will reply by email.</p>
<ul>
<li>Email: <a href="mailto:alifr0241@gmail.com">alifr0241@gmail.com</a></li>
<li>Phone: 01642121332</li>
<li>Location: Joydevpur, Gazipur</li>
</ul>
<p><a href="index.html">Back to home</a></p>
</div>
<form id="contact-form" novalidate>
<div><label for="name">Your name</label><input type="text" id="name" name="name" autocomplete="name"><p class="err" data-for="name"></p></div>
<div><label for="email">Your email</label><input type="email" id="email" name="email" autocomplete="email"><p class="err" data-for="email"></p></div>
<fieldset><legend>I am contacting you about</legend>
<label><input type="radio" name="type" value="job" checked> A job</label>
<label><input type="radio" name="type" value="project"> A project</label>
<label><input type="radio" name="type" value="other"> Something else</label></fieldset>
<div><label for="topic">Preferred reply</label>
<select id="topic" name="reply"><option>Email</option><option>Phone</option></select></div>
<div><label for="msg">Message</label><textarea id="msg" name="msg" rows="5"></textarea><p class="err" data-for="msg"></p></div>
<button class="btn" type="submit">Send message</button>
<div id="result" role="status"></div>
</form>
</div>
</section>
